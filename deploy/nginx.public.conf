server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Docker DNS có thể chưa đăng ký alias api ở đúng khoảnh khắc Nginx khởi động.
  # Resolve động giúp frontend tự phục hồi khi API được recreate trong lúc deploy.
  resolver 127.0.0.11 ipv6=off valid=10s;
  resolver_timeout 5s;
  set $api_upstream api;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location ^~ /api/ {
    proxy_pass http://$api_upstream:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /media/ {
    proxy_pass http://$api_upstream:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /sitemap.xml {
    proxy_pass http://$api_upstream:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /robots.txt {
    proxy_pass http://$api_upstream:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
