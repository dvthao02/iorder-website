name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy staging
    if: >-
      github.event_name == 'workflow_dispatch' && (inputs.target == 'staging' || inputs.target == 'production') ||
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    container: ghcr.io/railwayapp/cli:latest
    environment:
      name: staging
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Railway staging
        run: railway up --service="${RAILWAY_SERVICE_ID}"

  deploy-production:
    name: Deploy production
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.target == 'production' ||
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    needs: deploy-staging
    runs-on: ubuntu-24.04
    container: ghcr.io/railwayapp/cli:latest
    environment:
      name: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Railway production
        run: railway up --service="${RAILWAY_SERVICE_ID}"
